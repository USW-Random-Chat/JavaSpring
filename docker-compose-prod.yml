version: '3.7'
services:
  app:
    container_name: suchat
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # 프로덕션에서는 80 포트로 리다이렉트
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis
    networks:
      - app-network

  mysql:
    container_name: suchat-mysql
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: suchat
      MYSQL_USER: suchat_user
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  redis:
    container_name: suchat-redis
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
