server:
  port: 8080

spring:

  #  smtp
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # Redis 설정 추가
  redis:
    host: localhost
    port: 6379
    #password: 'redis6379'
    password: ""
#  profiles:
#    active: local
#jwt.secret.key 값
jwt:
  secret:
    key: ${JWT_SECRET_KEY}
# 인증번호 4자리 설정
verification:
  code:
    length: 4

logging.level:
  org.hibernate.SQL: debug
#  p6spygotj
#  org.hibernate.type: trace