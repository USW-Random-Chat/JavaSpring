server:
  port: 8080

spring:

  #  smtp
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail.username}
    password: ${mail.password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # Redis 설정 추가
  redis:
    host: localhost
    port: 6379
    #password: 'redis6379'
    password: ""
#  profiles:
#    active: local

# 인증번호 4자리 설정
verification:
  code:
    length: 4
logging.level:
  org.hibernate.SQL: debug
